name: Auto Update Reject Rules

on:
  push:
    branches: [ "main", "master" ]
    paths-ignore:
      - 'reject_rules.json'
      - 'My_rules_RUS.json'
      - 'my_rules_proxy.json'
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Parse and Sort Karing Logs from Dropbox
        run: |
          find . -name "parse_logs.py" -exec python {} \;

      - name: Fix JSON Syntax Automatically
        shell: python
        run: |
          import json
          import re
          import os

          for file_name in ["My_rules_RUS.json", "reject_rules.json", "my_rules_proxy.json"]:
              for root, dirs, files in os.walk("."):
                  if file_name in files:
                      file_path = os.path.join(root, file_name)
                      try:
                          with open(file_path, "r", encoding="utf-8", errors="ignore") as f:
                              content = f.read()
                          content = re.sub(r'[\u200b\u200c\u200d\ufeff\u200e\u200f\u00ad]', '', content)
                          content = content.replace('“', '"').replace('”', '"')
                          data = json.loads(content)
                          with open(file_path, "w", encoding="utf-8") as f:
                              json.dump(data, f, indent=2, ensure_ascii=False)
                          print(f"{file_name} syntax verified and formatting fixed!")
                      except Exception as e:
                          print(f"Skipping format for {file_name}: {e}")

      - name: Commit and Push changes
        run: |
          git config --local user.email "41898282+github-actions[bot]@://github.com"
          git config --local user.name "github-actions[bot]"
          git add reject_rules.json My_rules_RUS.json my_rules_proxy.json || true
          if git diff --staged --quiet; then
            echo "No changes."
          else
            git commit -m "Auto-parse logs from Dropbox [skip ci]"
            git push
          fi
