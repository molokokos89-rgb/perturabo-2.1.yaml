name: Proxy Sync

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-proxies:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout local repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Collect Raw Proxies
        run: |
          python collector.py

      - name: Filter and generate clean proxy list
        run: |
          python checker.py
          rm -f proxy_test.txt checker_test.py
      - name: Commit and Push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          git rm -f proxy_test.txt checker_test.py || true
          git add proxy.txt ru_proxies.txt ru_nodes.txt raw_combined.txt blocked.json allowed.json urls.txt || true
          git commit -m "auto-update clean proxies and rulesets [skip ci]" || echo "Nothing to commit"
          git push origin HEAD:${{ github.ref_name }}

      - name: Commit and Push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          git rm -f proxy_test.txt checker_test.py || true
          git add proxy.txt ru_proxies.txt ru_nodes.txt raw_combined.txt blocked.json allowed.json || true
          git commit -m "auto-update clean proxies and rulesets [skip ci]" || echo "Nothing to commit"
          git push origin HEAD:${{ github.ref_name }}